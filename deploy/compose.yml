# El stack completo. Cinco servicios y ni uno más: no hay un contenedor por módulo de dominio.
#
# La regla que ordena este fichero es el límite de privilegio (ADR-001): el gateway es lo que se
# expone y no tiene clave SSH; el core tiene la clave y no publica puerto.
# El nombre del proyecto es `jarvis-next` y no `jarvis` por una razón operativa concreta: el stack
# anterior declara `jarvis`, con servicios que se llaman igual (gateway, core, aisessions). Con el
# mismo nombre, un `docker compose up` lanzado desde el árbol viejo —o el `jarvis.service` que
# quedara habilitado apuntando allí— recrea estos contenedores con las imágenes de antes, encima
# de los de ahora, sin avisar. Dos árboles no pueden compartir identidad.
name: jarvis-next

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Lo único publicado hacia fuera.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      JARVIS_PUBLIC_HOST: ${JARVIS_PUBLIC_HOST:-localhost}
      JARVIS_ACME_EMAIL: ${JARVIS_ACME_EMAIL:-admin@example.com}
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    image: jarvis-gateway:${JARVIS_VERSION:-dev}
    restart: unless-stopped
    # Sin puertos publicados: sólo Caddy llega hasta aquí.
    expose:
      - "8080"
    environment:
      JARVIS_BIND: 0.0.0.0
      JARVIS_PORT: "8080"
      JARVIS_DATA_DIR: /var/lib/jarvis
      JARVIS_CORE_URL: http://core:8770
      JARVIS_RP_ID: ${JARVIS_RP_ID:-localhost}
      JARVIS_ORIGINS: ${JARVIS_ORIGINS:-}
      JARVIS_AUTH_POLICY: ${JARVIS_AUTH_POLICY:-passkey}
      # Caddy está delante de verdad, así que aquí sí se puede creer a X-Forwarded-For.
      JARVIS_TRUST_PROXY: "true"
      JARVIS_INTERNAL_SECRET: ${JARVIS_INTERNAL_SECRET:?define JARVIS_INTERNAL_SECRET en .env}
      # REVISAR EN CADA DESPLIEGUE: la escotilla de HTTP plano.
      JARVIS_INSECURE_LOGIN: ${JARVIS_INSECURE_LOGIN:-false}
      JARVIS_INSECURE_LOGIN_LAN_ONLY: ${JARVIS_INSECURE_LOGIN_LAN_ONLY:-true}
      JARVIS_INSECURE_COOKIES: ${JARVIS_INSECURE_COOKIES:-false}
    volumes:
      - jarvis-auth:/var/lib/jarvis
    depends_on:
      core:
        condition: service_healthy

  core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core
    image: jarvis-core:${JARVIS_VERSION:-dev}
    restart: unless-stopped
    expose:
      - "8770"
    environment:
      JARVIS_CORE_BIND: 0.0.0.0
      JARVIS_CORE_PORT: "8770"
      JARVIS_CORE_DB: /var/lib/jarvis-core/core.db
      JARVIS_HOSTS: ${JARVIS_HOSTS:?define la allowlist de hosts en .env}
      JARVIS_BASTION_HOST: ${JARVIS_BASTION_HOST:-bastion}
      JARVIS_INDEX_URL: http://aisessions:8765
      JARVIS_INDEX_TOKEN: ${JARVIS_INDEX_TOKEN:-}
      # El spool vive en la máquina que ejecuta, no en este contenedor: por eso va bajo el home
      # del usuario remoto y no en una ruta del sistema que sólo root podría crear. El core lo
      # resuelve con el home real de cada host.
      #
      # Se escribe con `~` y no con `$HOME` a propósito: Compose interpola `$HOME` con el entorno
      # de la máquina donde se lanza, así que el contenedor recibiría el home del bastión y todos
      # los hosts intentarían escribir en `/home/zeus`. La tilde no la expande nadie por el camino.
      JARVIS_SPOOL_ROOT: ${JARVIS_SPOOL_ROOT:-~/.local/state/jarvis/runs}
      JARVIS_ATTACHMENT_ROOT: ${JARVIS_ATTACHMENT_ROOT:-/tmp/jarvis-attachments}
      JARVIS_INTERNAL_SECRET: ${JARVIS_INTERNAL_SECRET:?define JARVIS_INTERNAL_SECRET en .env}
      JARVIS_ALLOW_YOLO: ${JARVIS_ALLOW_YOLO:-false}
      JARVIS_MODEL_API_KEY: ${JARVIS_MODEL_API_KEY:-}
      JARVIS_MODEL_NAME: ${JARVIS_MODEL_NAME:-claude-sonnet-5}
      # Sin estas dos, una credencial de OpenAI acaba hablando con la API de Anthropic: el
      # Assistant queda configurado y aun así no funciona, que es la peor forma de estar apagado.
      JARVIS_MODEL_BASE_URL: ${JARVIS_MODEL_BASE_URL:-https://api.anthropic.com}
      JARVIS_MODEL_PROVIDER: ${JARVIS_MODEL_PROVIDER:-}
      # El modelo que pone nombre a los workspaces. Estaba en el `.env` y no se pasaba al
      # contenedor, así que el core arrancaba sin él y **todos** los títulos salían del heurístico
      # local: de ahí nombres como «/model model». Un ajuste configurado que no llega es peor que
      # uno ausente, porque nadie vuelve a mirarlo.
      # --- el cerebro de casa y la puerta a la nube (ADR-009) ---------------
      #
      # Con `JARVIS_LOCAL_MODEL_BASE_URL` puesto, el asistente piensa en el `llama-server` del
      # bastión y la nube pasa a ser el sitio al que se escala **con permiso**. Sin él, todo sigue
      # exactamente como estaba: el modelo de nube es el que piensa.
      #
      # La URL es la de la LAN y no `127.0.0.1` por un motivo que cuesta media hora descubrir: el
      # core vive en un contenedor, y ahí `localhost` es el propio contenedor. El servidor local
      # escucha en toda la LAN y exige `Authorization: Bearer`, que es lo que evita que abrirlo
      # más allá de loopback sea abrirlo a cualquiera.
      JARVIS_ASSISTANT_MODEL_BASE_URL: ${JARVIS_ASSISTANT_MODEL_BASE_URL:-}
      # Si no se declara una propia, se usa la del modelo de la nube: los dos escalones suelen ser
      # el mismo proveedor y la misma cuenta, y duplicar un secreto es duplicar dónde se filtra.
      JARVIS_ASSISTANT_MODEL_API_KEY: ${JARVIS_ASSISTANT_MODEL_API_KEY:-${JARVIS_MODEL_API_KEY:-}}
      JARVIS_ASSISTANT_MODEL_NAME: ${JARVIS_ASSISTANT_MODEL_NAME:-}
      # Los dos que tumban la petición entera si van mal con un modelo que razona.
      JARVIS_ASSISTANT_MODEL_MAX_TOKENS_PARAM: ${JARVIS_ASSISTANT_MODEL_MAX_TOKENS_PARAM:-}
      JARVIS_ASSISTANT_MODEL_REASONING_EFFORT: ${JARVIS_ASSISTANT_MODEL_REASONING_EFFORT:-}
      JARVIS_ASSISTANT_MODEL_TEMPERATURE: ${JARVIS_ASSISTANT_MODEL_TEMPERATURE:-}
      JARVIS_ASSISTANT_MODEL_MAX_OUTPUT_TOKENS: ${JARVIS_ASSISTANT_MODEL_MAX_OUTPUT_TOKENS:-}
      JARVIS_CHAT_DIRECT_CAPABILITIES: ${JARVIS_CHAT_DIRECT_CAPABILITIES:-true}
      JARVIS_CHAT_MAX_TOOLS: ${JARVIS_CHAT_MAX_TOOLS:-128}
      # Nombres antiguos, cuando esto era un llama-server en el propio bastión.
      JARVIS_LOCAL_MODEL_BASE_URL: ${JARVIS_LOCAL_MODEL_BASE_URL:-}
      JARVIS_LOCAL_MODEL_API_KEY: ${JARVIS_LOCAL_MODEL_API_KEY:-}
      JARVIS_LOCAL_MODEL_NAME: ${JARVIS_LOCAL_MODEL_NAME:-}
      # Cuánto contexto tiene de verdad. Equivocarse aquí no degrada la respuesta: la impide.
      JARVIS_LOCAL_MODEL_TIMEOUT_MS: ${JARVIS_LOCAL_MODEL_TIMEOUT_MS:-180000}
      # A dónde se escala. Por defecto, el modelo de siempre: quien ya lo tenía no toca nada.
      JARVIS_CLOUD_MODEL_BASE_URL: ${JARVIS_CLOUD_MODEL_BASE_URL:-}
      JARVIS_CLOUD_MODEL_API_KEY: ${JARVIS_CLOUD_MODEL_API_KEY:-}
      JARVIS_CLOUD_MODEL_NAME: ${JARVIS_CLOUD_MODEL_NAME:-}
      JARVIS_CLOUD_MODEL_PROVIDER: ${JARVIS_CLOUD_MODEL_PROVIDER:-}
      JARVIS_CLOUD_MODEL_MAX_OUTPUT_TOKENS: ${JARVIS_CLOUD_MODEL_MAX_OUTPUT_TOKENS:-}
      JARVIS_CLOUD_MODEL_MAX_TOKENS_PARAM: ${JARVIS_CLOUD_MODEL_MAX_TOKENS_PARAM:-}

      # --- capacidades MCP que este core consume (ADR-009) ------------------
      #
      # Un servidor declarado aquí es de **sólo lectura** salvo que su nombre esté además en
      # JARVIS_MCP_WRITE_SERVERS. Y hay cuatro herramientas que no se sirven jamás —apagar,
      # reiniciar e instalar paquetes—, estén o no en la lista de denegación.
      JARVIS_MCP_SERVERS: ${JARVIS_MCP_SERVERS:-}
      JARVIS_MCP_TOKENS: ${JARVIS_MCP_TOKENS:-}
      JARVIS_MCP_WRITE_SERVERS: ${JARVIS_MCP_WRITE_SERVERS:-}
      JARVIS_MCP_ALLOW: ${JARVIS_MCP_ALLOW:-}
      JARVIS_MCP_DENY: ${JARVIS_MCP_DENY:-}
      JARVIS_MCP_STARTER: ${JARVIS_MCP_STARTER:-}
      JARVIS_CHAT_DEFAULT_AUTONOMY: ${JARVIS_CHAT_DEFAULT_AUTONOMY:-manual}
      JARVIS_CHAT_MAX_TOOL_CALLS: ${JARVIS_CHAT_MAX_TOOL_CALLS:-}
      JARVIS_CHAT_MAX_TURN_MS: ${JARVIS_CHAT_MAX_TURN_MS:-}
      JARVIS_MCP_MAX_OUTPUT_CHARS: ${JARVIS_MCP_MAX_OUTPUT_CHARS:-}
      JARVIS_ASSISTANT_MODEL_TOOL_RESULT_CHARS: ${JARVIS_ASSISTANT_MODEL_TOOL_RESULT_CHARS:-}
      # Dice por cada vuelta cuánto tardó, cuánto prompt pagó y cuánto reutilizó de caché. El
      # runbook manda encenderlo para diagnosticar el asistente, y hasta hoy la variable **no
      # llegaba al contenedor**: se prometía un control que no se tenía. Es la cuarta vez que pasa
      # en este fichero, y por eso las de arriba van también aunque tengan buenos valores por
      # defecto.
      JARVIS_VERBOSE: ${JARVIS_VERBOSE:-}

      JARVIS_TITLE_API_KEY: ${JARVIS_TITLE_API_KEY:-}
      JARVIS_TITLE_BASE_URL: ${JARVIS_TITLE_BASE_URL:-https://api.groq.com/openai}
      JARVIS_TITLE_MODEL: ${JARVIS_TITLE_MODEL:-llama-3.1-8b-instant}
      # Cuánto se guarda y cada cuánto se limpia. Van aquí porque **un ajuste que no llega al
      # contenedor es peor que uno que no existe**: promete un control que no se tiene, y cuando
      # alguien lo cambie en el `.env` no pasará nada y nadie sabrá por qué. Es el mismo fallo que
      # dejó los títulos saliendo del heurístico durante días, y ya van tres veces.
      JARVIS_EVENT_COMPACT_AFTER_DAYS: ${JARVIS_EVENT_COMPACT_AFTER_DAYS:-7}
      JARVIS_EVENT_DROP_AFTER_DAYS: ${JARVIS_EVENT_DROP_AFTER_DAYS:-30}
      JARVIS_EVENT_SUMMARY_CHARS: ${JARVIS_EVENT_SUMMARY_CHARS:-200}
      JARVIS_RETENTION_INTERVAL_MS: ${JARVIS_RETENTION_INTERVAL_MS:-21600000}
      JARVIS_SWEEP_INTERVAL_MS: ${JARVIS_SWEEP_INTERVAL_MS:-21600000}
      JARVIS_SPOOL_RETENTION_DAYS: ${JARVIS_SPOOL_RETENTION_DAYS:-7}
      JARVIS_TITLE_PER_MINUTE: ${JARVIS_TITLE_PER_MINUTE:-8}
      # Dónde recuerda el core las claves de host que ya ha visto (M32).
      #
      # Por defecto esto vivía en `/tmp`, que en un contenedor se vacía en cada arranque: con
      # `StrictHostKeyChecking=accept-new`, un fichero vacío significa aceptar a ciegas la primera
      # clave que responda por cada host, otra vez, en cada reinicio. Un TOFU que se repite no es
      # TOFU: es una ventana de suplantación cada vez que se despliega.
      #
      # Va al volumen de datos y no al `~/.ssh` montado porque ése es de sólo lectura a propósito
      # —lleva la clave de la flota— y ssh, al no poder anotar allí, avisa por stderr en cada
      # llamada; ese aviso terminaba dentro de la salida del agente. Este directorio es del usuario
      # del contenedor y persiste, que es justo lo que hacía falta.
      JARVIS_KNOWN_HOSTS_FILE: ${JARVIS_KNOWN_HOSTS_FILE:-/var/lib/jarvis-core/known_hosts}
      # SSH_AUTH_SOCK no se pasa (M33): se pasaba la variable pero el socket del agente no se
      # monta, así que apuntaba a algo que dentro del contenedor no existe. Una variable inerte no
      # es inofensiva, es un rastro falso para quien depure autenticación de ssh. La clave viaja
      # montada en `/home/node/.ssh`, que es como se autentica esto. Si algún día se quiere agente
      # de verdad, hay que montar el socket **además** de pasar la variable.
    volumes:
      - jarvis-core-data:/var/lib/jarvis-core
      # La clave de la flota, de sólo lectura y sólo aquí.
      - ${JARVIS_SSH_DIR:-../secrets/ssh}:/home/node/.ssh:ro
    depends_on:
      aisessions:
        condition: service_started

  # El índice histórico: sólo lectura y reconstruible. Se reutiliza tal cual del repo aiSessions.
  aisessions:
    build:
      context: ${JARVIS_AISESSIONS_REPO:-../../aisessions}
      dockerfile: ${JARVIS_AISESSIONS_DOCKERFILE:-../jarvis/deploy/Dockerfile.aisessions}
      args:
        JARVIS_UID: ${JARVIS_UID:-1000}
        JARVIS_GID: ${JARVIS_GID:-1000}
    image: ${JARVIS_AISESSIONS_IMAGE:-jarvis-aisessions:${JARVIS_VERSION:-dev}}
    restart: unless-stopped
    # `serve` es la API JSON de sólo lectura que consume el core. La imagen trae por defecto el
    # servidor MCP, que es otra cosa y va en otro puerto.
    # `--allow-remote-export` deja leer la conversación de una sesión que vive en otra máquina.
    # Sigue siendo sólo lectura —trae el fichero por ssh, no ejecuta nada— y aquí es lo correcto:
    # este índice ya tiene la clave de la flota montada y ya sincroniza por ssh. Sin esto, abrir
    # una sesión de goro2 o de vultr enseña el destino pero no lo que se dijo.
    command: ["aisessions", "serve", "--bind", "0.0.0.0", "--port", "8765", "--allow-remote-export"]
    # El healthcheck de la imagen vigila el puerto del MCP; aquí no sirve.
    healthcheck:
      disable: true
    expose:
      - "8765"
    volumes:
      - aisessions-data:/var/lib/aisessions
      - ${JARVIS_SSH_DIR:-../secrets/ssh}:${JARVIS_AISESSIONS_SSH_DIR:-/home/jarvis/.ssh}:ro

  # La sincronización con los hosts remotos, aparte del servidor que sirve las consultas.
  aisessions-sync:
    image: ${JARVIS_AISESSIONS_IMAGE:-jarvis-aisessions:${JARVIS_VERSION:-dev}}
    restart: unless-stopped
    command: ["/bin/sh", "/usr/local/lib/jarvis/aisessions-sync.sh"]
    healthcheck:
      disable: true
    environment:
      JARVIS_HOSTS: ${JARVIS_HOSTS:?define la allowlist de hosts en .env}
      JARVIS_SYNC_INTERVAL: ${JARVIS_SYNC_INTERVAL:-300}
      JARVIS_SYNC_HOST_TIMEOUT: ${JARVIS_SYNC_HOST_TIMEOUT:-240}
    volumes:
      - aisessions-data:/var/lib/aisessions
      - ${JARVIS_SSH_DIR:-../secrets/ssh}:${JARVIS_AISESSIONS_SSH_DIR:-/home/jarvis/.ssh}:ro
      - ./aisessions-sync.sh:/usr/local/lib/jarvis/aisessions-sync.sh:ro
    depends_on:
      aisessions:
        condition: service_started

volumes:
  caddy-data:
  caddy-config:
  jarvis-auth:
  jarvis-core-data:
  aisessions-data:
