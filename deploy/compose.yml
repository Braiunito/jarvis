# El stack completo. Cinco servicios y ni uno más: no hay un contenedor por módulo de dominio.
#
# La regla que ordena este fichero es el límite de privilegio (ADR-001): el gateway es lo que se
# expone y no tiene clave SSH; el core tiene la clave y no publica puerto.
# El nombre del proyecto es `jarvis-next` y no `jarvis` por una razón operativa concreta: el stack
# anterior declara `jarvis`, con servicios que se llaman igual (gateway, core, aisessions). Con el
# mismo nombre, un `docker compose up` lanzado desde el árbol viejo —o el `jarvis.service` que
# quedara habilitado apuntando allí— recrea estos contenedores con las imágenes de antes, encima
# de los de ahora, sin avisar. Dos árboles no pueden compartir identidad.
name: jarvis-next

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Lo único publicado hacia fuera.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      JARVIS_PUBLIC_HOST: ${JARVIS_PUBLIC_HOST:-localhost}
      JARVIS_ACME_EMAIL: ${JARVIS_ACME_EMAIL:-admin@example.com}
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    image: jarvis-gateway:${JARVIS_VERSION:-dev}
    restart: unless-stopped
    # Sin puertos publicados: sólo Caddy llega hasta aquí.
    expose:
      - "8080"
    environment:
      JARVIS_BIND: 0.0.0.0
      JARVIS_PORT: "8080"
      JARVIS_DATA_DIR: /var/lib/jarvis
      JARVIS_CORE_URL: http://core:8770
      JARVIS_RP_ID: ${JARVIS_RP_ID:-localhost}
      JARVIS_ORIGINS: ${JARVIS_ORIGINS:-}
      JARVIS_AUTH_POLICY: ${JARVIS_AUTH_POLICY:-passkey}
      # Caddy está delante de verdad, así que aquí sí se puede creer a X-Forwarded-For.
      JARVIS_TRUST_PROXY: "true"
      JARVIS_INTERNAL_SECRET: ${JARVIS_INTERNAL_SECRET:?define JARVIS_INTERNAL_SECRET en .env}
      # REVISAR EN CADA DESPLIEGUE: la escotilla de HTTP plano.
      JARVIS_INSECURE_LOGIN: ${JARVIS_INSECURE_LOGIN:-false}
      JARVIS_INSECURE_LOGIN_LAN_ONLY: ${JARVIS_INSECURE_LOGIN_LAN_ONLY:-true}
      JARVIS_INSECURE_COOKIES: ${JARVIS_INSECURE_COOKIES:-false}
    volumes:
      - jarvis-auth:/var/lib/jarvis
    depends_on:
      core:
        condition: service_healthy

  core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core
    image: jarvis-core:${JARVIS_VERSION:-dev}
    restart: unless-stopped
    expose:
      - "8770"
    environment:
      JARVIS_CORE_BIND: 0.0.0.0
      JARVIS_CORE_PORT: "8770"
      JARVIS_CORE_DB: /var/lib/jarvis-core/core.db
      JARVIS_HOSTS: ${JARVIS_HOSTS:?define la allowlist de hosts en .env}
      JARVIS_BASTION_HOST: ${JARVIS_BASTION_HOST:-bastion}
      JARVIS_INDEX_URL: http://aisessions:8765
      JARVIS_INDEX_TOKEN: ${JARVIS_INDEX_TOKEN:-}
      # El spool vive en la máquina que ejecuta, no en este contenedor: por eso va bajo el home
      # del usuario remoto y no en una ruta del sistema que sólo root podría crear. El core lo
      # resuelve con el home real de cada host.
      #
      # Se escribe con `~` y no con `$HOME` a propósito: Compose interpola `$HOME` con el entorno
      # de la máquina donde se lanza, así que el contenedor recibiría el home del bastión y todos
      # los hosts intentarían escribir en `/home/zeus`. La tilde no la expande nadie por el camino.
      JARVIS_SPOOL_ROOT: ${JARVIS_SPOOL_ROOT:-~/.local/state/jarvis/runs}
      JARVIS_ATTACHMENT_ROOT: ${JARVIS_ATTACHMENT_ROOT:-/tmp/jarvis-attachments}
      JARVIS_INTERNAL_SECRET: ${JARVIS_INTERNAL_SECRET:?define JARVIS_INTERNAL_SECRET en .env}
      JARVIS_ALLOW_YOLO: ${JARVIS_ALLOW_YOLO:-false}
      JARVIS_MODEL_API_KEY: ${JARVIS_MODEL_API_KEY:-}
      JARVIS_MODEL_NAME: ${JARVIS_MODEL_NAME:-claude-sonnet-5}
      # Sin estas dos, una credencial de OpenAI acaba hablando con la API de Anthropic: el
      # Assistant queda configurado y aun así no funciona, que es la peor forma de estar apagado.
      JARVIS_MODEL_BASE_URL: ${JARVIS_MODEL_BASE_URL:-https://api.anthropic.com}
      JARVIS_MODEL_PROVIDER: ${JARVIS_MODEL_PROVIDER:-}
      # El modelo que pone nombre a los workspaces. Estaba en el `.env` y no se pasaba al
      # contenedor, así que el core arrancaba sin él y **todos** los títulos salían del heurístico
      # local: de ahí nombres como «/model model». Un ajuste configurado que no llega es peor que
      # uno ausente, porque nadie vuelve a mirarlo.
      JARVIS_TITLE_API_KEY: ${JARVIS_TITLE_API_KEY:-}
      JARVIS_TITLE_BASE_URL: ${JARVIS_TITLE_BASE_URL:-https://api.groq.com/openai}
      JARVIS_TITLE_MODEL: ${JARVIS_TITLE_MODEL:-llama-3.1-8b-instant}
      JARVIS_TITLE_PER_MINUTE: ${JARVIS_TITLE_PER_MINUTE:-8}
      SSH_AUTH_SOCK: ${SSH_AUTH_SOCK:-}
    volumes:
      - jarvis-core-data:/var/lib/jarvis-core
      # La clave de la flota, de sólo lectura y sólo aquí.
      - ${JARVIS_SSH_DIR:-../secrets/ssh}:/home/node/.ssh:ro
    depends_on:
      aisessions:
        condition: service_started

  # El índice histórico: sólo lectura y reconstruible. Se reutiliza tal cual del repo aiSessions.
  aisessions:
    build:
      context: ${JARVIS_AISESSIONS_REPO:-../../aisessions}
      dockerfile: ${JARVIS_AISESSIONS_DOCKERFILE:-../jarvis/deploy/Dockerfile.aisessions}
      args:
        JARVIS_UID: ${JARVIS_UID:-1000}
        JARVIS_GID: ${JARVIS_GID:-1000}
    image: ${JARVIS_AISESSIONS_IMAGE:-jarvis-aisessions:${JARVIS_VERSION:-dev}}
    restart: unless-stopped
    # `serve` es la API JSON de sólo lectura que consume el core. La imagen trae por defecto el
    # servidor MCP, que es otra cosa y va en otro puerto.
    # `--allow-remote-export` deja leer la conversación de una sesión que vive en otra máquina.
    # Sigue siendo sólo lectura —trae el fichero por ssh, no ejecuta nada— y aquí es lo correcto:
    # este índice ya tiene la clave de la flota montada y ya sincroniza por ssh. Sin esto, abrir
    # una sesión de goro2 o de vultr enseña el destino pero no lo que se dijo.
    command: ["aisessions", "serve", "--bind", "0.0.0.0", "--port", "8765", "--allow-remote-export"]
    # El healthcheck de la imagen vigila el puerto del MCP; aquí no sirve.
    healthcheck:
      disable: true
    expose:
      - "8765"
    volumes:
      - aisessions-data:/var/lib/aisessions
      - ${JARVIS_SSH_DIR:-../secrets/ssh}:${JARVIS_AISESSIONS_SSH_DIR:-/home/jarvis/.ssh}:ro

  # La sincronización con los hosts remotos, aparte del servidor que sirve las consultas.
  aisessions-sync:
    image: ${JARVIS_AISESSIONS_IMAGE:-jarvis-aisessions:${JARVIS_VERSION:-dev}}
    restart: unless-stopped
    command: ["/bin/sh", "/usr/local/lib/jarvis/aisessions-sync.sh"]
    healthcheck:
      disable: true
    environment:
      JARVIS_HOSTS: ${JARVIS_HOSTS:?define la allowlist de hosts en .env}
      JARVIS_SYNC_INTERVAL: ${JARVIS_SYNC_INTERVAL:-300}
      JARVIS_SYNC_HOST_TIMEOUT: ${JARVIS_SYNC_HOST_TIMEOUT:-240}
    volumes:
      - aisessions-data:/var/lib/aisessions
      - ${JARVIS_SSH_DIR:-../secrets/ssh}:${JARVIS_AISESSIONS_SSH_DIR:-/home/jarvis/.ssh}:ro
      - ./aisessions-sync.sh:/usr/local/lib/jarvis/aisessions-sync.sh:ro
    depends_on:
      aisessions:
        condition: service_started

volumes:
  caddy-data:
  caddy-config:
  jarvis-auth:
  jarvis-core-data:
  aisessions-data:
